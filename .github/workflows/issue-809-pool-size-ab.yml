name: Git 809 Windows POSIX FIFO experiment
on:
  push:
    branches: [experiment-809-windows-posix-fifo]
    paths:
      - experiments/issue-809/**
      - .github/workflows/issue-809-pool-size-ab.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-posix-fifo:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Git for Windows MSYS2 SDK
        uses: git-for-windows/setup-git-for-windows-sdk@v2
        with:
          flavor: full
      - name: Verify POSIX toolchain and run shared Unix FIFO worker
        shell: bash
        run: |
          set -x
          export MSYSTEM=MSYS
          export PATH="/usr/bin:$PATH"
          pacman -S --needed --noconfirm gcc python openssl-devel zlib-devel libiconv-devel
          test -f /usr/include/openssl/ssl.h
          test -f /usr/include/zlib.h
          command -v gcc
          command -v python3
          command -v mkfifo
          test "$(command -v gcc)" = /usr/bin/gcc
          test "$(command -v python3)" = /usr/bin/python3
          python3 -c 'import os; assert os.name == "posix"; assert hasattr(os,"mkfifo")'
          bash -n experiments/issue-809/git-manager-unix.sh
          python3 -m py_compile experiments/issue-809/unix_git_worker_build.py experiments/issue-809/unix_git_ipc_pool.py experiments/issue-809/pool_size_ab_benchmark.py
          # Git-for-Windows sources include the Cygwin path helper declarations,
          # but their MSYS GCC target does not automatically link the helper.
          # Keep these compatibility additions local to this temporary checkout.
          printf '%s\n' 'COMPAT_OBJS += compat/win32/path-utils.o' 'NEEDS_LIBICONV = YesPlease' >> config.mak
          python3 experiments/issue-809/pool_size_ab_benchmark.py
          # Phase profiling is separate from acceptance timings.
          test -f git.exe
          export GIT809_WORKER_GIT="$PWD/git.exe"
          export GIT809_PROFILE_PHASES=1
          export GIT809_TRACE_MANAGER=1
          # ABBA repeats both modes against the same Git build and Windows runner.
          # Keep timing diagnostics separate from the uninstrumented benchmark.
          # Same-runner ABBA comparison. Only the Bash reply read mode varies.
          export GIT809_PERSISTENT_REQ=0
          for mode in blocking timed timed blocking; do
            export GIT809_REPLY_READ_MODE="$mode"
            bash --noprofile --norc -c 'source experiments/issue-809/git-manager-unix.sh 3 || exit 1; for ((i=0;i<40;i++)); do git-ipc --version >/dev/null || exit 2; done; sleep .05; cat "$_GIT809_UNIX_MANAGER_LOG"'
          done
      - name: Preserve all raw measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: git809-windows-posix-fifo
          path: git809-bash-pipe-results/pool-size-matched-1to5-windows.json
          if-no-files-found: warn
