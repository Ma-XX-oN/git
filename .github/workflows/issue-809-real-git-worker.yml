name: Git 809 real Git worker four-channel native acceptance
on:
  push:
    branches: [investigation-809-git-startup]
    paths:
      - experiments/issue-809/windows_real_git_worker_build.py
      - experiments/issue-809/windows_real_git_manager.py
      - experiments/issue-809/windows_real_git_acceptance.py
      - .github/workflows/issue-809-real-git-worker.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-native:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: git-for-windows/setup-git-for-windows-sdk@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build temporary real Git worker and run Bash four-channel acceptance
        shell: bash
        run: |
          . /etc/profile
          PYTHON_EXE="$(cygpath -u "$pythonLocation")/python.exe"
          "$PYTHON_EXE" -m py_compile experiments/issue-809/windows_real_git_worker_build.py
          "$PYTHON_EXE" -m py_compile experiments/issue-809/windows_real_git_manager.py
          "$PYTHON_EXE" -m py_compile experiments/issue-809/windows_real_git_acceptance.py
          "$PYTHON_EXE" experiments/issue-809/windows_real_git_acceptance.py
      - name: Upload real Git worker output and exact source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: git809-real-git-four-channel
          path: git809-bash-pipe-results/real-git-worker-four-channel.json
          if-no-files-found: warn
