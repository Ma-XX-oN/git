name: RWF 809 native Windows direct export stream validation
on:
  push:
    branches: [tmp1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-native-stream:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: git-for-windows/setup-git-for-windows-sdk@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile native Git named-pipe worker and decoder
        shell: bash
        run: |
          . /etc/profile
          make -j4 NO_RUST=YesPlease NO_CURL=YesPlease NO_GETTEXT=YesPlease git.exe
      - name: Check environment roundtrip, cwd, isolation, and IPC latency
        shell: bash
        run: |
          . /etc/profile
          set -uo pipefail
          PYTHON_EXE="$(cygpath -u "$pythonLocation")/python.exe"
          export GIT809_MANAGER_PYTHON="$(cygpath -w "$PYTHON_EXE")"
          export GIT809_WORKER_GIT="$(cygpath -w "$PWD/git.exe")"
          export GIT809_DRAIN_MODE=chunk100
          mkdir -p git809-stream-results
          export GIT809_TIMING_LOG="$PWD/git809-stream-results/phases.csv"
          bash -n experiments/issue-809/git-ipc-request.sh || exit 21
          source experiments/issue-809/git-manager.sh 3 || exit 22
          [[ "$(git-ipc --version)" == "$("$GIT809_WORKER_GIT" --version)" ]] || exit 23
          cd experiments/issue-809
          [[ "$(git-ipc rev-parse --show-prefix)" == "experiments/issue-809/" ]] || exit 24
          cd ../..
          for v in 'simple' 'sp ace' 'slash\back' 'quote"value' '$(echo DO-NOT-EXECUTE)' $'line1\nline2' $'tab\tvalue' $'carriage\rreturn' $'unicode-\u00e9-\u2603' $'single'\''quote' $'tick\x60value' ""; do
            actual="$(GIT_EDITOR="$v" git-ipc var GIT_EDITOR)" || { printf 'failed %q\n' "$v" >&2; exit 31; }
            [[ "$actual" == "$v" ]] || { printf 'mismatch expected=%q actual=%q\n' "$v" "$actual" >&2; exit 32; }
          done
          [[ ! -v GIT_EDITOR ]] || exit 33
          printf 'GIT809_STREAM_ROUNDTRIP_PASS\n'
          printf 'mode,sample,start_direct,end_direct,start_ipc,end_ipc\n' >git809-stream-results/pairs.csv
          for mode in chunk100 alternate1ms; do
            if [[ $mode == chunk100 ]]; then
              export GIT809_DRAIN_MODE=chunk100
            else
              unset GIT809_DRAIN_MODE
            fi
            for ((i=0;i<20;i++)); do
              if (( i % 2 == 0 )); then
                a=$EPOCHREALTIME; "$GIT809_WORKER_GIT" --version >/dev/null || exit 41; b=$EPOCHREALTIME
                c=$EPOCHREALTIME; git-ipc --version >/dev/null || exit 42; d=$EPOCHREALTIME
              else
                c=$EPOCHREALTIME; git-ipc --version >/dev/null || exit 43; d=$EPOCHREALTIME
                a=$EPOCHREALTIME; "$GIT809_WORKER_GIT" --version >/dev/null || exit 44; b=$EPOCHREALTIME
              fi
              printf '%s,%s,%s,%s,%s,%s\n' "$mode" "$i" "$a" "$b" "$c" "$d" >>git809-stream-results/pairs.csv
            done
          done
          "$PYTHON_EXE" - <<'PY'
          import csv, os, statistics
          from decimal import Decimal
          rows=list(csv.DictReader(open('git809-stream-results/pairs.csv',newline='',encoding='utf-8')))
          for mode in ('chunk100','alternate1ms'):
            subset=[r for r in rows if r['mode']==mode]
            assert len(subset)==20, (mode,len(subset))
            for kind,begin,end in (('direct','start_direct','end_direct'),('ipc','start_ipc','end_ipc')):
              values=[float((Decimal(r[end])-Decimal(r[begin]))*1000) for r in subset]
              assert min(values)>0,(mode,kind,values)
              print('GIT809_DRAIN_AB',mode,kind,'median_ms',round(statistics.median(values),4),flush=True)
          phases=list(csv.reader(open('git809-stream-results/phases.csv',newline='',encoding='utf-8')))
          assert len(phases)>=40,len(phases)
          stages=list(zip(*[
            [float((Decimal(row[i+1])-Decimal(row[i]))*1000) for i in range(5)]
            for row in phases[-40:]
          ]))
          for name,values in zip(('allocate','connect','request','drain','status'),stages):
            print('GIT809_PHASE',name,'median_ms',round(statistics.median(values),4),flush=True)
          print('GIT809_DRAIN_SHA',os.environ['GITHUB_SHA'])
          PY
      - name: Preserve timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: git809-native-direct-export-windows
          path: git809-stream-results/
          if-no-files-found: warn
