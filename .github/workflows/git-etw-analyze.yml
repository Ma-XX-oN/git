name: RWF809 corrected historical ETW IRP pairing
on:
  push:
    branches: [investigation/etw-native-io-correlation-20261113]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  correlate:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          run-id: 43506464466
          name: git-file-io-etw-c49517f990ab9c5dc732bb320b2d0322d8fc4784
          github-token: ${{ github.token }}
          path: etw-input
      - name: Decode ETW and correlate exact Git PIDs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p etw-analysis
          tracerpt.exe etw-input/file-io-trace.etl -o etw-analysis/events.csv -of CSV -y
          python - <<'PY'
          import collections
          import csv
          import json
          import statistics
          from pathlib import Path

          root = Path("etw-input")
          manifest = json.loads((root / "trace-manifest.json").read_text(encoding="utf-8"))
          assert manifest["complete"] and len(manifest["operations"]) == 24
          pids = {entry["pid"] for entry in manifest["operations"]}
          counts = collections.Counter()
          direct = collections.Counter()
          examples = []
          total = 0
          inflight = {}
          durations = collections.defaultdict(list)
          file_costs = collections.defaultdict(list)
          failure_status = collections.Counter()
          with Path("etw-analysis/events.csv").open(encoding="utf-8-sig", errors="replace", newline="") as f:
            reader = csv.reader(f)
            header = [x.strip() for x in next(reader)]
            needed = ["Event Name", "Type", "PID", "TID", "Clock-Time"]
            assert all(key in header for key in needed), header
            idx = {key: header.index(key) for key in needed}
            for row in reader:
              total += 1
              if len(row) <= idx["Clock-Time"]:
                continue
              category = row[idx["Event Name"]].strip()
              typ = row[idx["Type"]].strip()
              if category not in ("FileIo", "DiskIo", "Image", "Process", "Thread"):
                continue
              key = category + "/" + typ
              counts[key] += 1
              p = row[idx["PID"]].strip()
              try:
                pid = int(p, 16) if p.lower().startswith("0x") else int(p)
              except ValueError:
                pid = None
              if pid in pids:
                direct[key] += 1
                if category == "FileIo" and len(row) >= 22:
                  ticks = int(row[idx["Clock-Time"]].strip())
                  irp = row[19].strip()
                  if typ == "OperationEnd":
                    preceding = inflight.pop((pid, irp), None)
                    if preceding:
                      operation, begin_ticks, filename = preceding
                      delta_ticks = ticks - begin_ticks
                      if 0 <= delta_ticks <= 100000000:
                        elapsed_ms = delta_ticks / 10000
                        durations[operation].append(elapsed_ms)
                        if operation == "Create":
                          leaf = filename.replace(chr(92), "/").rsplit("/", 1)[-1].lower()
                          file_costs[leaf].append(elapsed_ms)
                          status = row[21].strip()
                          if status != "0":
                            failure_status[(leaf, status)] += 1
                  elif typ in ("Create", "Read", "Write", "QueryInfo", "Close", "Cleanup", "DirEnum", "FSControl"):
                    filename = row[25].strip().strip('"') if typ == "Create" and len(row) > 25 else ""
                    inflight[(pid, irp)] = (typ, ticks, filename)
                if len(examples) < 15 and category in ("FileIo", "DiskIo"):
                  examples.append({"key": key, "pid": pid, "fields": row[:30]})
          def aggregate(values):
            ordered = sorted(values)
            return {
              "count": len(ordered),
              "total_ms_inclusive": round(sum(ordered), 4),
              "median_ms": round(statistics.median(ordered), 5),
              "p95_ms": round(ordered[(95 * (len(ordered) - 1)) // 100], 5),
              "max_ms": round(ordered[-1], 5),
            }
          print("ETW_CORRELATION_PAIR_COUNT", sum(len(v) for v in durations.values()))
          assert sum(len(v) for v in durations.values()) > 1000, "Too few matched start/end file operations"
          report = {
            "source_git_sha256": manifest["git_sha256"],
            "source_revision": manifest["revision"],
            "etl_sha256": manifest["trace_file"]["sha256"],
            "total_events": total,
            "all_event_counts": dict(counts.most_common()),
            "direct_git_pid_events": dict(direct.most_common()),
            "direct_git_event_examples": examples,
            "matched_file_operation_durations": {
              key: aggregate(values) for key, values in sorted(durations.items())
            },
            "most_expensive_created_filenames": [
              {"name": name, **aggregate(values)}
              for name, values in sorted(file_costs.items(), key=lambda item: sum(item[1]), reverse=True)[:35]
            ],
            "failed_create_status_by_filename": [
              {"name": name, "ntstatus": status, "count": count}
              for (name, status), count in failure_status.most_common(30)
            ],
            "warning": "Matched start/end events correlate by (PID, IRP pointer); times include ETW overhead and may overlap. Kernel-context PID=0 events and physical DiskIo requests are not attributed."
          }
          Path("etw-analysis/summary.json").write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")
          print("ETW_TOTAL", total)
          print("ETW_EXACT_GIT_PID", sum(direct.values()))
          print("ETW_GIT_IO", json.dumps({key: value for key, value in direct.items() if key.startswith(("FileIo/", "DiskIo/"))}))
          print("ETW_EXAMPLES", json.dumps(examples[:6])[:6000])
          print("ETW_OPERATION_LATENCY", json.dumps(report["matched_file_operation_durations"]))
          print("ETW_EXPENSIVE_FILES", json.dumps(report["most_expensive_created_filenames"][:20]))
          print("ETW_FAILED_CREATES", json.dumps(report["failed_create_status_by_filename"][:15]))
          PY
          rm etw-analysis/events.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: git-etw-analysed-${{ github.sha }}
          path: etw-analysis/summary.json
          if-no-files-found: warn
