name: Git 809 default CI Git kernel ETW attribution
on:
  push:
    branches: [investigation-809-git-startup]
    paths:
      - experiments/issue-809/default_ci_kernel_etw.ps1
      - .github/workflows/issue-809-default-ci-etw.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  default-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Trace only default Git CI invocations and kernel image-loader lifecycle
        shell: pwsh
        run: ./experiments/issue-809/default_ci_kernel_etw.ps1
      - name: Upload safe aggregate kernel trace status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: git809-default-ci-etw-summary
          path: git809-default-ci-etw/*.json
          if-no-files-found: warn
