name: Git 809 Windows named-pipe configuration isolation
on:
  push:
    branches: [investigation-809-git-startup]
    paths:
      - experiments/issue-809/windows_pipe_config_matrix.py
      - .github/workflows/issue-809-pipe-config.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-pipe-config:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: git-for-windows/setup-git-for-windows-sdk@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compare C versus original Python pipe configuration using Git Bash
        shell: bash
        run: |
          . /etc/profile
          PYTHON_EXE="$(cygpath -u "$pythonLocation")/python.exe"
          "$PYTHON_EXE" -m py_compile experiments/issue-809/windows_pipe_config_matrix.py
          "$PYTHON_EXE" experiments/issue-809/windows_pipe_config_matrix.py
