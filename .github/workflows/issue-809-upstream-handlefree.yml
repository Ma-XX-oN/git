name: Git 809 upstream native-pipe metadata query experiment
on:
  push:
    branches: [experiment-809-upstream-handlefree-probe]
    paths:
      - experiments/issue-809/patch_msys2_upstream_handlefree_query.py
      - .github/workflows/issue-809-upstream-handlefree.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-msys2-runtime:
    runs-on: windows-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: git-for-windows/setup-git-for-windows-sdk@v2
        with:
          flavor: full
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build disposable SDK runtime source
        shell: bash
        run: |
          set -euxo pipefail
          export MSYSTEM=MSYS
          export PATH="/usr/bin:$PATH"
          pacman -S --needed --noconfirm base-devel msys2-devel python mingw-w64-cross-mingw32-gcc
          # The runtime packaging recipe is dated September 2026, when MSYS
          # GCC 15.3.0-1 was current. Restore that signed historical compiler
          # package pair rather than adjusting C++ source or compiler flags.
          pacman -U --noconfirm \
            https://repo.msys2.org/msys/x86_64/gcc-libs-15.3.0-1-x86_64.pkg.tar.zst \
            https://repo.msys2.org/msys/x86_64/gcc-15.3.0-1-x86_64.pkg.tar.zst
          test "$(pacman -Q gcc)" = "gcc 15.3.0-1"
          test "$(pacman -Q gcc-libs)" = "gcc-libs 15.3.0-1"
          # The MSYS MinGW cross-compiler is independent of host GCC.
          # GCC 16.2 rejects preexisting C++ utility declarations in this
          # 3.6.10 source. Use the archived pre-GCC-16 cross compiler.
          pacman -U --noconfirm https://repo.msys2.org/msys/x86_64/mingw-w64-cross-mingw32-gcc-15.2.0-1-x86_64.pkg.tar.zst
          test "$(pacman -Q mingw-w64-cross-mingw32-gcc)" = "mingw-w64-cross-mingw32-gcc 15.2.0-1"
          gcc --version | head -n 1
          export PATH="/opt/bin:/usr/bin:$PATH"
          command -v i686-w64-mingw32-gcc
          command -v x86_64-w64-mingw32-gcc
          command -v makepkg
          # Use the 3.6.10-4 packaging recipe corresponding to the installed
          # Git-for-Windows SDK runtime. Do not update its production packages.
          mkdir -p /usr/src/MSYS2-packages
          git -C /usr/src/MSYS2-packages init
          git -C /usr/src/MSYS2-packages remote add origin https://github.com/msys2/MSYS2-packages.git
          git -C /usr/src/MSYS2-packages fetch --depth=1 origin af487d629edc364cac6388e3e072b70d652236a3
          git -C /usr/src/MSYS2-packages checkout --detach FETCH_HEAD
          cd /usr/src/MSYS2-packages/msys2-runtime
          # Package metadata predates the current VCS archive checksum.
          # Independently pin the signed upstream Cygwin 3.6.10 tag; only
          # the archive digest may be reconciled, never the patch checksums.
          makepkg -g > /tmp/git809-source-hashes.txt
          tag_commit=$(git --git-dir=msys2-runtime rev-parse 'refs/tags/cygwin-3.6.10^{commit}')
          printf 'GIT809_SOURCE_TAG_COMMIT=%s\\n' "$tag_commit"
          test "$tag_commit" = b11613e477c006b2ce0332463ed07f1118260e79
          python3 - <<'GIT809_HASH'
          import re
          from pathlib import Path
          recipe = Path("PKGBUILD")
          original = recipe.read_text()
          updated = Path("/tmp/git809-source-hashes.txt").read_text()
          pattern = r"'([0-9a-f]{64}|SKIP)'"
          old_block = original.split("sha256sums=(", 1)[1].split(")", 1)[0]
          new_block = updated.split("sha256sums=(", 1)[1].split(")", 1)[0]
          old_hashes = re.findall(pattern, old_block)
          new_hashes = re.findall(pattern, new_block)
          assert len(old_hashes) == len(new_hashes) > 40, "hash-count mismatch"
          assert old_hashes[1:] == new_hashes[1:], "non-VCS source checksum changed"
          assert old_hashes[0] != new_hashes[0], "unexpected unchanged VCS checksum"
          head, tail = original.split("sha256sums=(", 1)
          assert tail.count(old_hashes[0]) == 1, "VCS checksum not unique"
          recipe.write_text(head + "sha256sums=(" + tail.replace(old_hashes[0], new_hashes[0], 1))
          print(f"GIT809_VCS_DIGEST expected={old_hashes[0]} actual={new_hashes[0]}")
          GIT809_HASH
          # The historical source archive has a checksum mismatch; verify the
          # extracted upstream commit instead of trusting that archive.
          makepkg --nobuild --syncdeps --noconfirm --skipchecksums
          test -f src/msys2-runtime/winsup/cygwin/path.cc
          # PKGBUILD fetches the upstream Cygwin 3.6.10 tag and applies
          # MSYS2 patches; the fork commit is NOT the source HEAD here.
          upstream=$(git -C src/msys2-runtime rev-parse "refs/tags/cygwin-3.6.10^{commit}")
          actual_source=$(git -C src/msys2-runtime rev-parse HEAD)
          test "$actual_source" = "$upstream"
          printf "GIT809_RUNTIME_UPSTREAM_SHA=%s\n" "$actual_source"
          sha256sum /usr/bin/msys-2.0.dll
      - name: Apply exact name-restricted source test and rebuild runtime
        shell: bash
        run: |
          set -euxo pipefail
          export MSYSTEM=MSYS
          export PATH="/opt/bin:/usr/bin:$PATH"
          python3 -m py_compile experiments/issue-809/patch_msys2_upstream_handlefree_query.py
          python3 experiments/issue-809/patch_msys2_upstream_handlefree_query.py \
            /usr/src/MSYS2-packages/msys2-runtime/src/msys2-runtime/winsup/cygwin/path.cc
          cd /usr/src/MSYS2-packages/msys2-runtime
          git -C src/msys2-runtime diff -- winsup/cygwin/path.cc
          # Build only the MSYS runtime DLL required by the pipe experiment.
          # The full package also compiles unrelated cygcheck utilities whose
          # historical declarations are rejected by the current SDK headers.
          python3 - <<'GIT809_DLL_ONLY'
          from pathlib import Path
          recipe = Path("PKGBUILD")
          source = recipe.read_text()
          old = '  LC_ALL=C make' + chr(10) + '  LC_ALL=C make -j1 DESTDIR="${srcdir}"/dest install' + chr(10)
          new = (
            '  LC_ALL=C make configure-target-winsup' + chr(10)
            + '  test -f x86_64-pc-cygwin/winsup/cygwin/Makefile' + chr(10)
            + '  LC_ALL=C make -C x86_64-pc-cygwin/winsup/cygwin '
            + 'child_info_magic.h shared_info_magic.h globals.h localtime.patched.c' + chr(10)
            + '  LC_ALL=C make -C x86_64-pc-cygwin/winsup/cygwin new-msys-2.0.dll' + chr(10)
            + '  mkdir -p "${srcdir}"/dest/usr/bin' + chr(10)
            + '  cp x86_64-pc-cygwin/winsup/cygwin/new-msys-2.0.dll '
            + '"${srcdir}"/dest/usr/bin/msys-2.0.dll' + chr(10)
          )
          assert source.count(old) == 1, "historical build recipe changed"
          source = source.replace(old, new)
          # Packaging is unnecessary: retain the original source and flags,
          # but stage the unstripped DLL for the isolated executable test.
          recipe.write_text(source)
          GIT809_DLL_ONLY
          makepkg --noextract --noprepare --syncdeps --noconfirm --skipchecksums
          test -s src/dest/usr/bin/msys-2.0.dll
          workspace_posix=$(cygpath -u "$GITHUB_WORKSPACE")
          printf '%s\n' "$PWD/src/dest/usr/bin/msys-2.0.dll" > "$workspace_posix/experiments/issue-809/patched-runtime-path.txt"
          sha256sum src/dest/usr/bin/msys-2.0.dll
      - name: Run existing upstream pathname regression tests against newly built runtime
        shell: bash
        run: |
          set -euxo pipefail
          export MSYSTEM=MSYS
          export PATH="/opt/bin:/usr/bin:$PATH"
          root=/usr/src/MSYS2-packages/msys2-runtime/src
          suite=$(find "$root" -path '*/winsup/testsuite/Makefile' -print -quit)
          test -n "$suite"
          cd "$(dirname "$suite")"
          make check TESTS="winsup.api/ltp/open02 winsup.api/ltp/open03 winsup.api/ltp/stat01 winsup.api/ltp/stat02 winsup.api/ltp/stat03 winsup.api/ltp/lstat02 winsup.api/ltp/readlink01 winsup.api/ltp/readlink02 winsup.api/ltp/symlink01 winsup.api/ltp/symlink02"
      - name: Compare pristine Git Bash and isolated patched runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sdk = 'D:\git-sdk-64-full\usr\bin'
          if (-not (Test-Path "$sdk\bash.exe")) { throw 'SDK Bash missing' }
          $location = Get-Content experiments/issue-809/patched-runtime-path.txt -Raw
          $location = $location.Trim()
          $win = (& "$sdk\cygpath.exe" -w "$location").Trim()
          if (-not (Test-Path $win)) { throw "Patched DLL not found: $win" }
          # Keep the original SDK runtime entirely untouched. Windows searches
          # the executable's directory first for its imported runtime DLL.
          $isolated = Join-Path $env:RUNNER_TEMP 'git809-patched-bash'
          New-Item -ItemType Directory -Path $isolated -Force | Out-Null
          Copy-Item "$sdk\bash.exe" "$isolated\bash.exe" -Force
          # Bash imports additional MSYS shared libraries. Keep the full
          # dependency family beside it; replace only this isolated runtime.
          Copy-Item "$sdk\msys-*.dll" $isolated -Force
          Copy-Item $win "$isolated\msys-2.0.dll" -Force
          $bash = "$isolated\bash.exe"
          if ((Get-FileHash "$sdk\msys-2.0.dll" -Algorithm SHA256).Hash -eq
              (Get-FileHash "$isolated\msys-2.0.dll" -Algorithm SHA256).Hash) {
            throw 'Patched runtime identical to stock runtime'
          }
          foreach ($direction in @('read','write')) {
            Write-Output "PIPE_QUERY_CASE mode=original direction=$direction instances=1"
            python -u experiments/issue-809/windows_pipe_open_trace.py --client bash --instances 1 --direction $direction --bash "$sdk\bash.exe" --expect failure
            if ($LASTEXITCODE -ne 0) { throw "Original control failed: $direction" }
          }
          & $bash --noprofile --norc -c 'printf "PATCHED_BASH_START_OK\n"'
          if ($LASTEXITCODE -ne 0) { throw 'Isolated patched Bash failed to start' }
          # No application-specific names: all valid native pipe names
          # must have the same no-throwaway-connection behavior.
          foreach ($direction in @('read','write')) {
            foreach ($nameKind in @('matched','unmatched','malformed')) {
              Write-Output "PIPE_QUERY_CASE mode=patched direction=$direction instances=1 namespace=$nameKind"
              python -u experiments/issue-809/windows_pipe_open_trace.py --client bash --instances 1 --direction $direction --bash $bash --expect success --name-kind $nameKind
              if ($LASTEXITCODE -ne 0) { throw "Single instance native-pipe query failed: $direction $nameKind" }
            }
          }
          & $bash --noprofile --norc -c 'f=$(mktemp) || exit 1; printf "normal_file_ok\n" > "$f" || exit 2; IFS= read -r payload < "$f" || exit 3; test "$payload" = normal_file_ok || exit 4; rm -f "$f"'
          if ($LASTEXITCODE -ne 0) { throw "Ordinary file redirection regression" }
