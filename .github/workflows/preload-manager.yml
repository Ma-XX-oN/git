name: Native preload manager
on:
  push:
    branches: [codex/preload-manager-cpp]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-preload-manager-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: git-for-windows/setup-git-for-windows-sdk@v2
        if: runner.os == 'Windows'
        with:
          flavor: full
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Dependencies
        shell: bash
        run: |
          python -m pip install meson ninja psutil matplotlib
          if [[ $RUNNER_OS == macOS ]]; then
            brew list bash >/dev/null 2>&1 || brew install bash
            echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          fi
      - name: Make build
        shell: bash
        run: |
          if [[ $RUNNER_OS == Windows ]]; then
            . /etc/profile || exit 1
            cd "$GITHUB_WORKSPACE"
          fi
          make -j4 USE_PRELOAD_MANAGER=YesPlease NO_RUST=YesPlease NO_CURL=YesPlease NO_GETTEXT=YesPlease all
          make -j4 NO_RUST=YesPlease NO_CURL=YesPlease NO_GETTEXT=YesPlease preload/perf/ready-worker$([[ $RUNNER_OS == Windows ]] && printf .exe) preload/perf/manager-protocol$([[ $RUNNER_OS == Windows ]] && printf .exe)
      - name: Validate native manager and worker
        shell: bash
        run: |
          if [[ $RUNNER_OS == Windows ]]; then
            pwsh="$(command -v pwsh)" || exit 1
            . /etc/profile || exit 1
            cd "$GITHUB_WORKSPACE"
            py="$(cygpath -u "$pythonLocation")/python.exe"
            gitbin="$(cygpath -w "$PWD/git.exe")"
            export PRELOAD_MANAGER="$(cygpath -w "$PWD/preload-manager.exe")"
            "$py" preload/tests/test_windows_worker_lifecycle.py "$gitbin"
            # Stdin through manager-launched workers, under both managers.
            "$py" preload/tests/test_manager_stdin.py --git "$gitbin" --output native-results/manager-stdin
            "$py" preload/tests/test_transport.py "$(cygpath -w "$PWD/t/helper/test-tool.exe")"
            "$pwsh" -NoProfile -File preload/tests/test_powershell.ps1 -Git "$gitbin" -Manager "$PRELOAD_MANAGER" -Output "$(cygpath -w "$PWD/native-results/powershell")"
          else
            py="$pythonLocation/bin/python3"
            gitbin="$PWD/git"
            export PRELOAD_MANAGER="$PWD/preload-manager"
            "$py" preload/tests/test_posix_worker.py "$gitbin"
            "$py" preload/tests/test_transport.py "$PWD/t/helper/test-tool"
          fi
          export PATH="$PWD:$PATH"
          "$py" -m unittest discover -s preload/tests -p test_native_manager.py -v
          "$py" preload/tests/test_manager.py --git "$gitbin" --output native-results/protocol
          "$py" preload/tests/test_preload_subprocess.py --git "$gitbin"
          "$py" preload/tests/test_owner_death.py --git "$gitbin"
          "$py" preload/tests/test_worker_crash.py --git "$gitbin"
          "$py" preload/tests/test_many_arguments.py --git "$gitbin"
          "$py" preload/tests/test_shell_environment.py --git "$gitbin" --output native-results/environment
          "$py" preload/tests/test_existing_regressions.py --git "$gitbin" --output native-results/commands
          "$py" preload/tests/test_shell_output.py --git "$gitbin" --output native-results/output
          "$py" preload/tests/acceptance.py --git "$gitbin" --count 6000 --trace --output native-results/stress
      - name: Meson build and parity
        shell: bash
        run: |
          options=()
          if [[ $RUNNER_OS == Windows ]]; then
            . /etc/profile || exit 1
            cd "$GITHUB_WORKSPACE"
            py="$(cygpath -u "$pythonLocation")/python.exe"
            export PATH="$(cygpath -u "$pythonLocation")/Scripts:$PWD:$PATH"
            options+=("-Dsane_tool_path=$(cygpath -am /usr/bin)")
          else
            py="$pythonLocation/bin/python3"
          fi
          "$py" -m mesonbuild.mesonmain setup build-manager -Dpreload_manager=enabled -Drust=disabled -Dcurl=disabled -Dgettext=disabled -Dgit_gui=disabled -Dgitk=disabled -Dzlib_backend=zlib "${options[@]}"
          "$py" -m mesonbuild.mesonmain compile -C build-manager -j4
          if [[ $RUNNER_OS == Windows ]]; then
            gitbin="$(cygpath -w "$PWD/build-manager/git.exe")"
            export PRELOAD_MANAGER="$(cygpath -w "$PWD/build-manager/preload-manager.exe")"
            "$py" preload/tests/test_windows_worker_lifecycle.py "$gitbin"
          else
            gitbin="$PWD/build-manager/git"
            export PRELOAD_MANAGER="$PWD/build-manager/preload-manager"
            "$py" preload/tests/test_posix_worker.py "$gitbin"
          fi
          "$py" -m unittest discover -s preload/tests -p test_native_manager.py -v
          "$py" preload/tests/test_manager.py --git "$gitbin" --output native-results/meson-protocol
          "$py" preload/tests/test_existing_regressions.py --git "$gitbin" --output native-results/meson-commands
      - name: Matched Python and C++ measurements
        shell: bash
        run: |
          if [[ $RUNNER_OS == Windows ]]; then
            pwsh="$(command -v pwsh)" || exit 1
            . /etc/profile || exit 1
            cd "$GITHUB_WORKSPACE"
            py="$(cygpath -u "$pythonLocation")/python.exe"
            export PATH="${pwsh%/*}:$PWD:$PATH"
            gitbin="$(cygpath -w "$PWD/git.exe")"
          else
            py="$pythonLocation/bin/python3"
            gitbin="$PWD/git"
            export PATH="$PWD:$PATH"
          fi
          "$py" preload/perf/compare_managers.py --git "$gitbin" --output native-results/performance
      # The three-way steps run even if an earlier measurement step failed.
      - name: Check out unmodified upstream Git
        if: ${{ !cancelled() }}
        uses: actions/checkout@v4
        with:
          # Branch point of the preload work on upstream master (v2.56.0-349).
          ref: 750f5de7dfe9a4062f95088212b063f189d50e91
          path: three-way-upstream
          persist-credentials: false
      - name: Check out the Python-manager release
        if: ${{ !cancelled() }}
        uses: actions/checkout@v4
        with:
          ref: working-version-3
          path: three-way-python
          persist-credentials: false
      - name: Unmodified, Python-manager and C++-manager Git in one job
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          if [[ $RUNNER_OS == Windows ]]; then
            . /etc/profile || exit 1
            cd "$GITHUB_WORKSPACE"
            py="$(cygpath -u "$pythonLocation")/python.exe"
          else
            py="$pythonLocation/bin/python3"
          fi
          # Same make flags as the main build, so GIT-CFLAGS match across trees.
          for tree in three-way-upstream three-way-python; do
            make -C "$tree" -j4 NO_RUST=YesPlease NO_CURL=YesPlease NO_GETTEXT=YesPlease git$([[ $RUNNER_OS == Windows ]] && printf .exe)
          done
          "$py" preload/perf/compare_three_way.py --upstream three-way-upstream --python-tree three-way-python --output native-results/three-way
          # The tip's Python and C++ managers (and, on Windows, the git function).
          "$py" preload/perf/compare_tip_managers.py --upstream three-way-upstream --output native-results/tip-managers
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-manager-${{ runner.os }}-${{ github.sha }}
          path: |
            native-results/
            build-manager/meson-logs/
