name: RWF 809 Windows allocator lifecycle stress
on:
  push:
    branches: [investigation-809-allocator-resource-lifecycle, experiment-809-unidirectional-t-handshake]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-native-stream:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: git-for-windows/setup-git-for-windows-sdk@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile native Git named-pipe worker and decoder
        shell: bash
        run: |
          . /etc/profile
          make -j4 NO_RUST=YesPlease NO_CURL=YesPlease NO_GETTEXT=YesPlease git.exe
      - name: Check environment roundtrip, cwd, isolation, and IPC latency
        shell: bash
        run: |
          . /etc/profile
          set -uo pipefail
          PYTHON_EXE="$(cygpath -u "$pythonLocation")/python.exe"
          export GIT809_MANAGER_PYTHON="$(cygpath -w "$PYTHON_EXE")"
          export GIT809_WORKER_GIT="$(cygpath -w "$PWD/git.exe")"
          export GIT809_DRAIN_MODE=chunk100
          mkdir -p git809-stream-results
          "$PYTHON_EXE" -m py_compile experiments/issue-809/windows_git_ipc_pool.py experiments/issue-809/test_allocator_probe_hold.py experiments/issue-809/test_windows_transport_selection.py
          "$PYTHON_EXE" experiments/issue-809/test_windows_transport_selection.py
          bash -n experiments/issue-809/git-ipc-request.sh || exit 21
          source experiments/issue-809/git-manager.sh 3 || exit 22
          trap 'rc=$?; if [[ -n ${_GIT809_MANAGER_LOG:-} && -f $_GIT809_MANAGER_LOG ]]; then cp -- "$_GIT809_MANAGER_LOG" git809-stream-results/manager.log; if (( rc != 0 )); then tail -n 120 -- "$_GIT809_MANAGER_LOG" >&2; fi; fi; exit "$rc"' EXIT
          # Bound the first allocation so a blocking native connection
          # produces the manager diagnostic instead of consuming the 45m job.
          git-ipc --version >git809-stream-results/smoke.out &
          smoke_pid=$!
          ( sleep 30; kill -TERM "$smoke_pid" 2>/dev/null || :; sleep 2; kill -KILL "$smoke_pid" 2>/dev/null || : ) &
          watchdog_pid=$!
          smoke_rc=0
          wait "$smoke_pid" || smoke_rc=$?
          kill "$watchdog_pid" 2>/dev/null || :
          wait "$watchdog_pid" 2>/dev/null || :
          if (( smoke_rc != 0 )); then
            printf 'GIT809_SMOKE_FAIL rc=%s\\n' "$smoke_rc" >&2
            exit 23
          fi
          [[ "$(cat git809-stream-results/smoke.out)" == "$("$GIT809_WORKER_GIT" --version)" ]] || exit 23
          cd experiments/issue-809
          [[ "$(git-ipc rev-parse --show-prefix)" == "experiments/issue-809/" ]] || exit 24
          cd ../..
          for v in 'simple' 'sp ace' 'slash\back' 'quote"value' '$(echo DO-NOT-EXECUTE)' $'line1\nline2' $'tab\tvalue' $'carriage\rreturn' $'unicode-\u00e9-\u2603' $'single'\''quote' $'tick\x60value' ""; do
            actual="$(GIT_EDITOR="$v" git-ipc var GIT_EDITOR)" || { printf 'failed %q\n' "$v" >&2; exit 31; }
            [[ "$actual" == "$v" ]] || { printf 'mismatch expected=%q actual=%q\n' "$v" "$actual" >&2; exit 32; }
          done
          [[ ! -v GIT_EDITOR ]] || exit 33
          printf 'GIT809_STREAM_ROUNDTRIP_PASS\n'

          # Only serial calls are in scope for RWF 809.
          printf 'GIT809_SERIAL_EXECUTION_ONLY\n'
          export GIT809_ABLATION_CWD=1 GIT809_ABLATION_ENV=1
          printf 'sample,begin,end\n' >git809-stream-results/stress.csv
          for ((i=0;i<6000;i++)); do
            a=$EPOCHREALTIME
            git-ipc --version >/dev/null || {
              printf 'GIT809_ALLOCATOR_STRESS_FAIL iteration=%s\n' "$i" >&2
              exit 42
            }
            b=$EPOCHREALTIME
            printf '%s,%s,%s\n' "$i" "$a" "$b" >>git809-stream-results/stress.csv
            if (( i % 500 == 0 )); then printf 'GIT809_STRESS_PROGRESS %s\n' "$i"; fi
          done
          git-ipc rev-parse --show-toplevel >/dev/null || exit 43
          # Hand a worker to a second Bash; kill the shell and assert the worker exits.
          export GIT809_SHELL_LIBRARY="$PWD/experiments/issue-809/git-manager.sh"
          "$PYTHON_EXE" - <<'PY'
          import ctypes as C, os, re, shutil, subprocess, sys
          from ctypes import wintypes as W
          k=C.WinDLL("kernel32",use_last_error=True)
          k.OpenProcess.argtypes=[W.DWORD,W.BOOL,W.DWORD]
          k.OpenProcess.restype=W.HANDLE
          k.WaitForSingleObject.argtypes=[W.HANDLE,W.DWORD]
          k.WaitForSingleObject.restype=W.DWORD
          k.CloseHandle.argtypes=[W.HANDLE]
          k.CloseHandle.restype=W.BOOL
          bash=shutil.which("bash")
          assert bash,"Git Bash not found"
          script=r'''
          source "$GIT809_SHELL_LIBRARY" 3 || exit 51
          printf 'OWNER_WINPID %s\n' "$_GIT809_OWNER_WINPID"
          sleep 120
          '''
          child=subprocess.Popen([bash,"--noprofile","--norc","-c",script],
            stdout=subprocess.PIPE,stderr=subprocess.PIPE,env=os.environ.copy(),
            text=True,encoding="utf-8")
          worker_handle=None
          try:
            line=child.stdout.readline().strip()
            if not line.startswith("OWNER_WINPID "):
              rc=child.wait(timeout=8)
              raise AssertionError(f"owner Bash rc={rc} stdout={line!r} stderr={child.stderr.read()!r}")
            owner=int(line.split()[1])
            result=subprocess.run(
              [sys.executable,"experiments/issue-809/test_allocator_probe_hold.py",str(owner)],
              capture_output=True,text=True,encoding="utf-8",timeout=20)
            assert result.returncode==0,(result.returncode,result.stdout,result.stderr)
            match=re.search(r"GIT809_PROBE_HOLD_PASS allocated_pid (\d+)",result.stdout)
            assert match,(result.stdout,result.stderr)
            pid=int(match.group(1))
            worker_handle=k.OpenProcess(0x00100000,False,pid)
            assert worker_handle,f"allocated Git worker {pid} not found"
            assert k.WaitForSingleObject(worker_handle,0)==258,"worker exited before Bash owner"
            child.kill()
            child.wait(timeout=5)
            state=k.WaitForSingleObject(worker_handle,5000)
            assert state==0,f"worker {pid} survived owning Bash exit: wait={state}"
            print("GIT809_OWNER_DEATH_PASS allocated_worker_pid",pid,flush=True)
            print("GIT809_PROBE_HOLD_PASS owner_shell",owner,flush=True)
          finally:
            if child.poll() is None: child.kill()
            child.wait(timeout=5)
            if worker_handle: k.CloseHandle(worker_handle)
          PY
          "$PYTHON_EXE" experiments/issue-809/test_allocator_probe_hold.py "$_GIT809_OWNER_WINPID" || exit 65
          cp -- "$_GIT809_MANAGER_LOG" git809-stream-results/manager.log
          "$PYTHON_EXE" - <<'PY'
          import csv,statistics,os,re
          from decimal import Decimal
          x=list(csv.DictReader(open('git809-stream-results/stress.csv',newline='',encoding='utf-8')))
          assert len(x)==6000,len(x)
          d=[float((Decimal(z['end'])-Decimal(z['begin']))*1000) for z in x]
          assert min(d)>0
          print('GIT809_STRESS_PASS count',len(d),'median_ms',round(statistics.median(d),4),flush=True)
          p='git809-stream-results/manager.log'
          log=open(p,encoding='utf-8',errors='replace').read()
          get_ids=re.findall(r'^GET_ACCEPT request_id=([0-9]+-[0-9]+) digit=([0-9]) instance_handle=([0-9]+)$',log,re.M)
          reply_ids=re.findall(r'^ALLOC_REPLY request_id=([0-9]+-[0-9]+) worker_pid=(WAIT|[0-9]+)$',log,re.M)
          selected_ids=re.findall(r'^REPLY_T_SELECTED request_id=([0-9]+-[0-9]+) digit=([0-9]) instance=([01]) handle=([0-9]+) connected=([01]),([01])
          assert len(get_ids)>=6000,('GET count',len(get_ids))
          request_ids=[row[0] for row in get_ids]
          assert len(set(request_ids))==len(request_ids),('duplicate GET identity',len(request_ids))
          reply_names=[row[0] for row in reply_ids]
          assert len(set(reply_names))==len(reply_names),('duplicate reply identity',len(reply_names))
          # A worker cannot be allocated to two overlapping requests.
          # Serial requests normally use different worker processes; PID
          # recycling after exit is permitted and is not a duplicate grant.
          assert all(pid!='WAIT' for _,pid in reply_ids),('worker pool exhausted',reply_ids[:5])
          assert set(reply_names)==set(request_ids),('unmatched GET/ID',len(request_ids),len(reply_names))
          selected_names=[row[0] for row in selected_ids]
          assert len(set(selected_names))==len(selected_names),('duplicate reply selection',len(selected_names))
          assert set(selected_names)==set(request_ids),('unselected reply',len(selected_names))
          assert all(int(req.split('-')[1])%10==int(digit) for req,digit,*_ in selected_ids),('reply-marker mismatch',selected_ids[:5])
          # Only a single transport for each request may carry the marker;
          # the other named-pipe instance is an unmarked Git Bash probe.
          assert 'REPLY_DOUBLE_MARKER' not in log,'both pipe instances carried a marker'
          assert all(int(req.split('-')[1])%10==int(digit) for req,digit,_ in get_ids)
          print('GIT809_IDENTITY_PASS GET',len(request_ids),'replies',len(reply_names),
                'T_selections',len(selected_names),
                'T_instance0',sum(row[2]=='0' for row in selected_ids),
                'T_instance1',sum(row[2]=='1' for row in selected_ids),flush=True)
          handles=[(int(a),int(h),int(w)) for a,h,w in re.findall(r'ALLOC_RESOURCE allocations=(\d+) manager_handles=(\d+) tracked_workers=(\d+)',log)]
          assert len(handles)>=55,len(handles)
          middle=[h for a,h,w in handles if a>=100 and a<=5500]
          assert max(middle)-min(middle)<120,(min(middle),max(middle))
          assert max(w for a,h,w in handles)<100, max(w for a,h,w in handles)
          print('GIT809_MANAGER_HANDLES first_last',handles[0],handles[-1],
                'min_max',min(middle),max(middle),flush=True)
          print('GIT809_STRESS_SHA',os.environ['GITHUB_SHA'])
          PY
      - name: Preserve timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: git809-native-direct-export-windows
          path: git809-stream-results/
          if-no-files-found: warn
,log,re.M)
          assert len(get_ids)>=6000,('GET count',len(get_ids))
          request_ids=[row[0] for row in get_ids]
          assert len(set(request_ids))==len(request_ids),('duplicate GET identity',len(request_ids))
          reply_names=[row[0] for row in reply_ids]
          assert len(set(reply_names))==len(reply_names),('duplicate reply identity',len(reply_names))
          assert set(reply_names)==set(request_ids),('unmatched GET/ID',len(request_ids),len(reply_names))
          selected_names=[row[0] for row in selected_ids]
          assert len(set(selected_names))==len(selected_names),('duplicate reply selection',len(selected_names))
          assert set(selected_names)==set(request_ids),('unselected reply',len(selected_names))
          assert all(int(req.split('-')[1])%10==int(digit) for req,digit,_ in get_ids)
          print('GIT809_IDENTITY_PASS GET',len(request_ids),'replies',len(reply_names),
                'T_selections',len(selected_names),
                'T_instance0',sum(row[1]=='0' for row in selected_ids),
                'T_instance1',sum(row[1]=='1' for row in selected_ids),flush=True)
          handles=[(int(a),int(h),int(w)) for a,h,w in re.findall(r'ALLOC_RESOURCE allocations=(\d+) manager_handles=(\d+) tracked_workers=(\d+)',log)]
          assert len(handles)>=55,len(handles)
          middle=[h for a,h,w in handles if a>=100 and a<=5500]
          assert max(middle)-min(middle)<120,(min(middle),max(middle))
          assert max(w for a,h,w in handles)<100, max(w for a,h,w in handles)
          print('GIT809_MANAGER_HANDLES first_last',handles[0],handles[-1],
                'min_max',min(middle),max(middle),flush=True)
          print('GIT809_STRESS_SHA',os.environ['GITHUB_SHA'])
          PY
      - name: Preserve timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: git809-native-direct-export-windows
          path: git809-stream-results/
          if-no-files-found: warn
