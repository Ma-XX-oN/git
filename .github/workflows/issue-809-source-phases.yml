name: Git 809 source-built Windows phase isolation
on:
  push:
    branches: [investigation-809-git-startup]
    paths:
      - experiments/issue-809/instrument_windows_git_source.py
      - .github/workflows/issue-809-source-phases.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-phases:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: git-for-windows/setup-git-for-windows-sdk@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build temporary stage-instrumented Git binary and benchmark phases
        shell: bash
        run: |
          . /etc/profile
          PYTHON_EXE="$(cygpath -u "$pythonLocation")/python.exe"
          test -f "$PYTHON_EXE"
          "$PYTHON_EXE" -m py_compile experiments/issue-809/instrument_windows_git_source.py
          "$PYTHON_EXE" experiments/issue-809/instrument_windows_git_source.py
      - name: Upload native source-stage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: git809-windows-source-phases
          path: git809-source-results/*.json
          if-no-files-found: warn
