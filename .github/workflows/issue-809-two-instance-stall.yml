name: Git 809 two-instance Windows IPC stall reproduction
on:
  push:
    branches: [experiment-809-two-instance-stall-diagnostic]
    paths:
      - experiments/issue-809/pool_size_ab_benchmark.py
      - experiments/issue-809/git-manager.sh
      - experiments/issue-809/windows_git_ipc_pool.py
      - experiments/issue-809/windows_real_git_worker_build.py
      - .github/workflows/issue-809-two-instance-stall.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-two-instance-stress:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: git-for-windows/setup-git-for-windows-sdk@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Eight rounds of 500 sequential real Git worker requests, 2-instance pipes
        shell: bash
        run: |
          . /etc/profile
          PYTHON_EXE="$(cygpath -u "$pythonLocation")/python.exe"
          export GIT809_MANAGER_PYTHON="$(cygpath -w "$PYTHON_EXE")"
          bash -n experiments/issue-809/git-manager.sh
          "$PYTHON_EXE" -m py_compile experiments/issue-809/pool_size_ab_benchmark.py experiments/issue-809/windows_real_git_worker_build.py experiments/issue-809/windows_git_ipc_pool.py
          "$PYTHON_EXE" experiments/issue-809/pool_size_ab_benchmark.py
      - name: Upload partial and completed results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: git809-two-instance-stall-diagnostic
          path: |
            git809-bash-pipe-results/pool-size-matched-1to5-windows.json
            git809-bash-pipe-results/two-instance-failure-round-*.log
          if-no-files-found: warn
