name: RWF 809 Windows native preload pool 1-5 P95 and stall stress
on:
  push:
    branches: [experiment-809-preload-stress-1to5]
    paths:
      - experiments/issue-809/pool_size_ab_benchmark.py
      - experiments/issue-809/windows_ipc_timeout_dumps.py
      - .github/workflows/issue-809-native-pool-p95.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-matched-runner-p95:
    runs-on: windows-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: git-for-windows/setup-git-for-windows-sdk@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build native preload Git once for all nine rounds
        shell: bash
        run: |
          . /etc/profile
          make -j4 NO_RUST=YesPlease NO_CURL=YesPlease NO_GETTEXT=YesPlease git.exe
      - name: Verify official native preload worker smoke
        shell: bash
        run: |
          . /etc/profile
          PYTHON_EXE="$(cygpath -u "$pythonLocation")/python.exe"
          "$PYTHON_EXE" t/helper/git809-preload-smoke.py "$(cygpath -w "$PWD/git.exe")"
      - name: Execute matched Windows P95 120-pair 1-2-3-4-5-4-3-2-1 sweep
        shell: bash
        run: |
          . /etc/profile
          PYTHON_EXE="$(cygpath -u "$pythonLocation")/python.exe"
          export GIT809_MANAGER_PYTHON="$(cygpath -w "$PYTHON_EXE")"
          "$PYTHON_EXE" -m py_compile experiments/issue-809/pool_size_ab_benchmark.py experiments/issue-809/windows_git_ipc_pool.py experiments/issue-809/windows_ipc_timeout_dumps.py
          bash -n experiments/issue-809/git-manager.sh
          "$PYTHON_EXE" -u experiments/issue-809/pool_size_ab_benchmark.py
      - name: Preserve raw pairs, P95 and timeout diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: git809-native-preload-windows-1to5-p95
          path: |
            git809-bash-pipe-results/
          if-no-files-found: warn
