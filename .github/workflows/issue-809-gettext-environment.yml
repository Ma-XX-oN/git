name: Git 809 gettext directory and initialization cost
on:
  push:
    branches: [investigation-809-git-startup]
    paths:
      - experiments/issue-809/git_gettext_environment_probe.py
      - .github/workflows/issue-809-gettext-environment.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gettext-environment:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: git-for-windows/setup-git-for-windows-sdk@v2
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable-x86_64-pc-windows-gnu
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build identical normal Git executable
        shell: bash
        run: |
          . /etc/profile
          export PATH="$(cygpath -u "$USERPROFILE")/.cargo/bin:$PATH"
          make -j4 git.exe
      - name: Test gettext environment stages with unchanged executable
        shell: bash
        run: |
          . /etc/profile
          PYTHON_EXE="$(cygpath -u "$pythonLocation")/python.exe"
          "$PYTHON_EXE" -m pip install pefile==2024.8.26
          "$PYTHON_EXE" -m py_compile experiments/issue-809/git_gettext_environment_probe.py
          "$PYTHON_EXE" experiments/issue-809/git_gettext_environment_probe.py
      - name: Upload full timestamp distributions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: git809-gettext-environment
          path: git809-gettext-env-results/windows-gettext-env.json
          if-no-files-found: warn
