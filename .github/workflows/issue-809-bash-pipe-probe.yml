name: Git 809 direct Bash Windows named pipe probe
on:
  push:
    branches: [investigation-809-git-startup]
    paths:
      - experiments/issue-809/windows_bash_pipe_probe.c
      - experiments/issue-809/windows_bash_pipe_probe.py
      - experiments/issue-809/windows_bash_pipe_trace.py
      - .github/workflows/issue-809-bash-pipe-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-native:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: git-for-windows/setup-git-for-windows-sdk@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test native named pipe write/read using Git Bash builtins only
        shell: bash
        run: |
          . /etc/profile
          PYTHON_EXE="$(cygpath -u "$pythonLocation")/python.exe"
          "$PYTHON_EXE" -m py_compile experiments/issue-809/windows_bash_pipe_probe.py
          "$PYTHON_EXE" experiments/issue-809/windows_bash_pipe_probe.py
          "$PYTHON_EXE" -m py_compile experiments/issue-809/windows_bash_pipe_trace.py
          "$PYTHON_EXE" experiments/issue-809/windows_bash_pipe_trace.py
      - name: Upload exact Bash IPC feasibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: git809-direct-bash-named-pipe
          path: git809-bash-pipe-results/*.json
          if-no-files-found: error
