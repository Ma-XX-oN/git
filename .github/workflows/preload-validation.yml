name: Preload production acceptance
on:
  push:
    branches: [production/preload, experiment/preload-git-function]
  workflow_dispatch:
    inputs:
      community_pr:
        description: Run full ordinary-Git suites for final community PR preparation
        type: boolean
        required: false
        default: false
      profile:
        description: Profile Unix allocation CPU, syscalls and scheduling only
        type: boolean
        required: false
        default: false
      transport:
        description: Compare Unix FIFO and TCP communication only
        type: boolean
        required: false
        default: false
      fixed_pid:
        description: Validate and measure Unix fixed-width PID replies
        type: boolean
        required: false
        default: false
permissions:
  contents: read
jobs:
  native:
    if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.profile || inputs.transport || inputs.fixed_pid)) }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: git-for-windows/setup-git-for-windows-sdk@v2
        if: runner.os == 'Windows'
        with:
          # Meson's feature probes need headers and import libraries omitted
          # from the SDK's Makefile-focused minimal subset.
          flavor: full
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Meson
        shell: bash
        run: |
          if [[ $RUNNER_OS == Windows ]]; then
            py="$(cygpath -u "$pythonLocation")/python.exe"
          else
            py="$pythonLocation/bin/python3"
          fi
          "$py" -m pip install meson ninja
      - name: Ensure Bash with EPOCHREALTIME on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew list bash >/dev/null 2>&1 || brew install bash
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
      - name: Build Makefile targets
        shell: bash
        run: |
          # SDK profile.d scripts use nonzero tests during normal startup;
          # source in a conditional context, then keep errexit for the build.
          if [[ $RUNNER_OS == Windows ]]; then
            . /etc/profile || exit 1
            cd "$GITHUB_WORKSPACE"
          fi
          make -j4 NO_RUST=YesPlease NO_CURL=YesPlease NO_GETTEXT=YesPlease all
      - name: Native preload and 6000-command stress
        shell: bash
        run: |
          if [[ $RUNNER_OS == Windows ]]; then
            . /etc/profile || exit 1
            cd "$GITHUB_WORKSPACE"
            py="$(cygpath -u "$pythonLocation")/python.exe"
            gitbin="$(cygpath -w "$PWD/git.exe")"
            helper="$(cygpath -w "$PWD/t/helper/test-tool.exe")"
            "$py" t/preload/test_windows_worker_lifecycle.py "$gitbin"
          else
            py="$pythonLocation/bin/python3"
            gitbin="$PWD/git"
            helper="$PWD/t/helper/test-tool"
            "$py" t/preload/test_posix_worker.py "$gitbin"
          fi
          "$py" t/preload/test_transport.py "$helper"
          "$py" t/preload/test_manager_lifecycle.py
          "$py" -m unittest discover -s t/preload -p test_manager_dispatch.py -v
          "$py" t/preload/test_preload_manager.py --git "$gitbin" --output preload-results/manager
          "$py" t/preload/test_owner_death.py --git "$gitbin"
          "$py" t/preload/test_shell_environment.py --git "$gitbin" --output preload-results/environment
          "$py" t/preload/test_existing_regressions.py --git "$gitbin" --output preload-results/commands
          "$py" t/preload/acceptance.py --git "$gitbin" --count 6000 --trace --output preload-results
          "$py" t/preload/test_shell_output.py --git "$gitbin" --output preload-results/output
      - name: Preserve native fast-path evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preload-native-${{ runner.os }}-${{ github.sha }}
          path: preload-results/
      - name: Build Meson and verify the worker
        shell: bash
        run: |
          meson_options=()
          if [[ $RUNNER_OS == Windows ]]; then
            . /etc/profile || exit 1
            cd "$GITHUB_WORKSPACE"
            py="$(cygpath -u "$pythonLocation")/python.exe"
            export PATH="$(cygpath -u "$pythonLocation")/Scripts:$PATH"
            # Use the SDK shell and tools consistently with the Makefile suite.
            # The installed Git shell does not expand t5580's winpwd alias.
            meson_options+=("-Dsane_tool_path=$(cygpath -am /usr/bin)")
          else
            py="$pythonLocation/bin/python3"
          fi
          "$py" -m mesonbuild.mesonmain setup build-preload -Drust=disabled -Dcurl=disabled -Dgettext=disabled -Dgit_gui=disabled -Dgitk=disabled -Dzlib_backend=zlib "${meson_options[@]}"
          "$py" -m mesonbuild.mesonmain compile -C build-preload -j4
          if [[ $RUNNER_OS == Windows ]]; then
            export PATH="/usr/bin:$PATH"
            gitbin="$(cygpath -w "$PWD/build-preload/git.exe")"
            "$py" t/preload/test_windows_worker_lifecycle.py "$gitbin"
          else
            gitbin="$PWD/build-preload/git"
            "$py" t/preload/test_posix_worker.py "$gitbin"
          fi
          "$py" t/preload/test_existing_regressions.py --git "$gitbin" --output preload-results/meson-commands
          "$py" -m mesonbuild.mesonmain test -C build-preload --print-errorlogs t5790-preload
      - name: Check out manager before READY dispatch optimization
        uses: actions/checkout@v4
        with:
          ref: 346517302dfc305cf122f359714c0dc12e4b0884
          path: dispatch-baseline
          sparse-checkout: contrib/preload
          persist-credentials: false
      - name: Compare READY dispatch with the same worker binary
        shell: bash
        run: |
          if [[ $RUNNER_OS == Windows ]]; then
            . /etc/profile || exit 1
            cd "$GITHUB_WORKSPACE"
            py="$(cygpath -u "$pythonLocation")/python.exe"
            gitbin="$(cygpath -w "$PWD/git.exe")"
          else
            py="$pythonLocation/bin/python3"
            gitbin="$PWD/git"
          fi
          "$py" t/perf/compare_preload_dispatch.py --baseline-library dispatch-baseline/contrib/preload/preload-manager.sh --git "$gitbin" --output preload-dispatch-comparison
      - name: Check out preserved baseline
        uses: actions/checkout@v4
        with:
          ref: production/preload
          path: baseline
          persist-credentials: false
      - name: Check out unmodified upstream Git
        uses: actions/checkout@v4
        with:
          # Branch point of production/preload on upstream master (v2.56.0-349).
          ref: 750f5de7dfe9a4062f95088212b063f189d50e91
          path: upstream
          persist-credentials: false
      - name: Compare baseline in the same job
        shell: bash
        run: |
          if [[ $RUNNER_OS == Windows ]]; then
            . /etc/profile || exit 1
            cd "$GITHUB_WORKSPACE"
            py="$(cygpath -u "$pythonLocation")/python.exe"
          else
            py="$pythonLocation/bin/python3"
          fi
          make -C baseline -j4 NO_RUST=YesPlease NO_CURL=YesPlease NO_GETTEXT=YesPlease git$([[ $RUNNER_OS == Windows ]] && printf .exe)
          make -C upstream -j4 NO_RUST=YesPlease NO_CURL=YesPlease NO_GETTEXT=YesPlease git$([[ $RUNNER_OS == Windows ]] && printf .exe)
          # Direct calls in every round run unmodified upstream Git, so one job
          # times upstream direct, pre-migration preloaded and migrated preloaded.
          "$py" t/perf/compare_preload_versions.py --baseline baseline --baseline-ref production/preload --upstream upstream --rounds 3 --output preload-comparison
          # Per-stage latency of preloaded calls (client and manager timestamps).
          if [[ $RUNNER_OS == Windows ]]; then gitbin="$(cygpath -w "$PWD/git.exe")"; else gitbin="$PWD/git"; fi
          "$py" t/perf/preload_stage_timing.py --git "$gitbin" --mode paced --output preload-stage-timing
          "$py" t/perf/preload_stage_timing.py --git "$gitbin" --mode burst --output preload-stage-timing
      - name: Verify POSIX builds without pthread support
        if: runner.os != 'Windows'
        shell: bash
        run: |
          make -j4 NO_PTHREADS=YesPlease NO_RUST=YesPlease NO_CURL=YesPlease NO_GETTEXT=YesPlease all
          ./git --version
          directory=$(mktemp -d "${TMPDIR:-/tmp}/git-preload-$$-XXXXXXXX")
          set +e
          PRELOAD_PID=$$ ./git --preload-worker "$directory" >preload-no-threads.out 2>preload-no-threads.err
          status=$?
          set -e
          [[ $status == 136 ]]
          grep -F -- '--preload-worker requires POSIX thread support' preload-no-threads.err
          rmdir "$directory"
      - name: Preserve raw acceptance and timing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preload-${{ runner.os }}-${{ github.sha }}
          path: |
            preload-results/
            preload-comparison/
            preload-stage-timing/
            preload-dispatch-comparison/
            t/test-results/
            build-preload/meson-logs/
            preload-no-threads.*

  profile:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.profile }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Linux tracing tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y strace linux-tools-generic
          sudo mount -t tracefs nodev /sys/kernel/tracing || true
      - name: Ensure modern Bash on macOS
        if: runner.os == 'macOS'
        run: |
          brew list bash >/dev/null 2>&1 || brew install bash
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
      - name: Build unchanged worker and check profiler accounting
        run: |
          make -j4 NO_RUST=YesPlease NO_CURL=YesPlease NO_GETTEXT=YesPlease git
          python -m unittest discover -s t/preload -p test_preload_profile.py -v
      - name: Profile real shell and manager paths
        run: python t/perf/profile_preload.py --git "$PWD/git" --output preload-profile
      - name: Preserve all profiling evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preload-profile-${{ runner.os }}-${{ github.sha }}
          path: preload-profile/

  transport:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.transport }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Ensure modern Bash on macOS
        if: runner.os == 'macOS'
        run: |
          brew list bash >/dev/null 2>&1 || brew install bash
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
      - name: Compare communication and framing
        run: |
          python -m unittest discover -s t/preload -p test_fifo_tcp.py -v
          python t/perf/compare_fifo_tcp.py --output transport-results/results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fifo-tcp-${{ runner.os }}
          path: transport-results/

  fixed-pid:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.fixed_pid }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Ensure modern Bash on macOS
        if: runner.os == 'macOS'
        run: |
          brew list bash >/dev/null 2>&1 || brew install bash
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
      - name: Build Makefile targets
        run: make -j4 NO_RUST=YesPlease NO_CURL=YesPlease NO_GETTEXT=YesPlease all
      - name: Validate fixed frames and worker fast path
        run: |
          python -m unittest discover -s t/preload -p test_manager_dispatch.py -v
          python -m unittest discover -s t/preload -p test_pid_reply.py -v
          python t/preload/test_posix_worker.py "$PWD/git"
          python t/preload/test_transport.py "$PWD/t/helper/test-tool"
          python t/preload/test_manager_lifecycle.py
          python t/preload/test_preload_manager.py --git "$PWD/git" --output pid-results/manager
          python t/preload/test_owner_death.py --git "$PWD/git"
          python t/preload/test_shell_environment.py --git "$PWD/git" --output pid-results/environment
          python t/preload/test_shell_output.py --git "$PWD/git" --output pid-results/output
          python t/preload/test_existing_regressions.py --git "$PWD/git" --output pid-results/commands
          python t/preload/acceptance.py --git "$PWD/git" --count 6000 --trace --output pid-results/acceptance
      - name: Build Meson and validate worker regressions
        run: |
          python -m pip install meson ninja
          python -m mesonbuild.mesonmain setup build-pid -Drust=disabled -Dcurl=disabled -Dgettext=disabled -Dgit_gui=disabled -Dgitk=disabled -Dzlib_backend=zlib
          python -m mesonbuild.mesonmain compile -C build-pid -j4
          python t/preload/test_posix_worker.py "$PWD/build-pid/git"
          python t/preload/test_existing_regressions.py --git "$PWD/build-pid/git" --output pid-results/meson-commands
          python -m mesonbuild.mesonmain test -C build-pid --print-errorlogs t5790-preload
      - uses: actions/checkout@v4
        with:
          ref: 26501aaea0
          path: pid-baseline
          sparse-checkout: contrib/preload
      - name: Compare full calls with identical worker binary
        run: |
          python t/perf/compare_preload_dispatch.py --baseline-library pid-baseline/contrib/preload/preload-manager.sh --baseline-ref 26501aaea0 --git "$PWD/git" --output pid-results/comparison
          python t/perf/preload_stage_timing.py --git "$PWD/git" --mode paced --output pid-results/stages
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixed-pid-${{ runner.os }}
          path: |
            pid-results/
            build-pid/meson-logs/

  regression:
    name: Final compatibility (${{ matrix.os }})
    needs: native
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.community_pr }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: git-for-windows/setup-git-for-windows-sdk@v2
        if: runner.os == 'Windows'
        with:
          # Meson's feature probes need headers and import libraries omitted
          # from the SDK's Makefile-focused minimal subset.
          flavor: full
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Meson
        shell: bash
        run: |
          if [[ $RUNNER_OS == Windows ]]; then
            py="$(cygpath -u "$pythonLocation")/python.exe"
          else
            py="$pythonLocation/bin/python3"
          fi
          "$py" -m pip install meson ninja
      - name: Ensure Bash with EPOCHREALTIME on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew list bash >/dev/null 2>&1 || brew install bash
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
      - name: Build Makefile targets
        shell: bash
        run: |
          # SDK profile.d scripts use nonzero tests during normal startup;
          # source in a conditional context, then keep errexit for the build.
          if [[ $RUNNER_OS == Windows ]]; then
            . /etc/profile || exit 1
            cd "$GITHUB_WORKSPACE"
          fi
          make -j4 NO_RUST=YesPlease NO_CURL=YesPlease NO_GETTEXT=YesPlease all
      - name: Git regression suite
        shell: bash
        run: |
          if [[ $RUNNER_OS == Windows ]]; then
            . /etc/profile || exit 1
            cd "$GITHUB_WORKSPACE"
            export GIT_BUILD_DIR="$(cygpath -au "$PWD")"
            # Git resolves script interpreters by basename. Select MSYS Perl
            # so the send-email tests can execute their shell sendmail fixture.
            export PATH="/usr/bin:$PATH"
          fi
          make -C t -j4 NO_RUST=YesPlease NO_CURL=YesPlease NO_GETTEXT=YesPlease DEFAULT_TEST_TARGET=test GIT_TEST_OPTS=--verbose-log
      - name: Build and test Meson
        shell: bash
        run: |
          meson_options=()
          if [[ $RUNNER_OS == Windows ]]; then
            . /etc/profile || exit 1
            cd "$GITHUB_WORKSPACE"
            py="$(cygpath -u "$pythonLocation")/python.exe"
            export PATH="$(cygpath -u "$pythonLocation")/Scripts:$PATH"
            # Use the SDK shell and tools consistently with the Makefile suite.
            # The installed Git shell does not expand t5580's winpwd alias.
            meson_options+=("-Dsane_tool_path=$(cygpath -am /usr/bin)")
          else
            py="$pythonLocation/bin/python3"
          fi
          "$py" -m mesonbuild.mesonmain setup build-preload -Drust=disabled -Dcurl=disabled -Dgettext=disabled -Dgit_gui=disabled -Dgitk=disabled -Dzlib_backend=zlib "${meson_options[@]}"
          "$py" -m mesonbuild.mesonmain compile -C build-preload -j4
          if [[ $RUNNER_OS == Windows ]]; then
            export PATH="/usr/bin:$PATH"
            "$py" -m mesonbuild.mesonmain test -C build-preload --print-errorlogs t5580-unc-paths
          fi
          "$py" -m mesonbuild.mesonmain test -C build-preload --print-errorlogs --num-processes 4
      - name: Preserve final compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preload-regression-${{ runner.os }}-${{ github.sha }}
          path: |
            t/test-results/
            build-preload/meson-logs/
