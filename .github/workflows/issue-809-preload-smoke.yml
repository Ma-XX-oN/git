name: Git 809 native preload Windows IPC smoke
on:
  push:
    branches: [feature/git-preinit-windows-upstream]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: git809-preload-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-preload:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: git-for-windows/setup-git-for-windows-sdk@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build real Git source with Git for Windows SDK
        shell: bash
        run: |
          . /etc/profile
          make -j4 NO_RUST=YesPlease NO_CURL=YesPlease NO_GETTEXT=YesPlease git.exe
      - name: Verify four-channel worker with early-closed stdin and exit propagation
        shell: bash
        run: |
          . /etc/profile
          PYTHON_EXE="$(cygpath -u "$pythonLocation")/python.exe"
          "$PYTHON_EXE" -m py_compile t/helper/git809-preload-smoke.py
          "$PYTHON_EXE" t/helper/git809-preload-smoke.py "$(cygpath -w "$PWD/git.exe")"
      - name: Verify Bash manager allocates real --preload workers
        shell: bash
        run: |
          . /etc/profile
          PYTHON_EXE="$(cygpath -u "$pythonLocation")/python.exe"
          export GIT809_MANAGER_PYTHON="$(cygpath -w "$PYTHON_EXE")"
          export GIT809_WORKER_GIT="$(cygpath -w "$PWD/git.exe")"
          "$PYTHON_EXE" -m py_compile experiments/issue-809/windows_git_ipc_pool.py
          bash -n experiments/issue-809/git-manager.sh
          source experiments/issue-809/git-manager.sh 2
          result="$(git-ipc --version)"
          [[ "$result" == git\ version\ * ]] || { printf 'unexpected ipc output: %s\n' "$result" >&2; exit 1; }
          printf '%s\n' "$result"
          cd experiments/issue-809
          prefix="$(git-ipc rev-parse --show-prefix)"
          [[ "$prefix" == "experiments/issue-809/" ]] || { printf 'cwd not forwarded: %s\n' "$prefix" >&2; exit 1; }
          editor="$(GIT_EDITOR=git809-inline git-ipc var GIT_EDITOR)"
          [[ "$editor" == git809-inline ]] || { printf 'environment not forwarded: %s\n' "$editor" >&2; exit 1; }
          [[ ! ${GIT_EDITOR+x} ]] || { printf 'parent environment was mutated\n' >&2; exit 1; }
          printf 'PASS cwd, inline environment, and parent isolation\n'
          direct="$(./git.exe --version)"
          [[ "$direct" == git\ version\ * ]] || exit 1
          for i in {1..30}; do
            git-ipc --version >/dev/null || { printf 'worker request %s failed\n' "$i" >&2; exit 1; }
          done
          printf 'PASS: direct Git unaffected and 30 worker replenishments\n'
