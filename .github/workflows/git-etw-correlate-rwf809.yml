name: RWF809 correct ETW Git operation correlation
on:
  push:
    branches: [investigation/etw-correlate-809-20261113]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: etw-correlation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  correlate:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          run-id: 43506464466
          name: git-file-io-etw-c49517f990ab9c5dc732bb320b2d0322d8fc4784
          github-token: ${{ github.token }}
          path: etw-input
      - name: Prove 22-field OperationEnd regression
        shell: pwsh
        run: |
          python -m py_compile preload/perf/etw_correlate.py preload/perf/test_etw_correlate.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python preload/perf/test_etw_correlate.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify SHA and decode original ETW capture
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force etw-analysis | Out-Null
          $manifest = Get-Content etw-input/trace-manifest.json -Raw | ConvertFrom-Json
          $sha = (Get-FileHash etw-input/file-io-trace.etl -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne $manifest.trace_file.sha256) {
            throw "Original ETL SHA mismatch"
          }
          Write-Host "ETW_VERIFIED_SHA256 $sha"
          & tracerpt.exe etw-input/file-io-trace.etl -o etw-analysis/events.csv -of CSV -y
          if ($LASTEXITCODE -ne 0) { throw "tracerpt failed" }
          python preload/perf/etw_correlate.py etw-analysis/events.csv etw-input/trace-manifest.json etw-analysis/summary.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item etw-analysis/events.csv -Force
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: etw-correlated-${{ github.sha }}
          path: etw-analysis/summary.json
          if-no-files-found: warn
