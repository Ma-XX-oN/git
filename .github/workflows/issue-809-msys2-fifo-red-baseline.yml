name: RWF 809 unchanged MSYS2 pipe-connection RED benchmark
on:
  push:
    branches: [experiment-809-msys2-fifo-wfmo-main]
    paths:
      - experiments/issue-809/windows_pipe_open_trace.py
      - experiments/issue-809/windows_pipe_open_latency.py
      - experiments/issue-809/msys2_fifo_unmodified_baseline.c
      - experiments/issue-809/MSYS2-FIFO-WFMO-DESIGN.md
      - .github/workflows/issue-809-msys2-fifo-red-baseline.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  red-baseline:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: git-for-windows/setup-git-for-windows-sdk@v2
        with:
          flavor: full
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Capture unchanged runtime identity and independent FIFO read CPU baseline
        shell: bash
        run: |
          set -euxo pipefail
          export MSYSTEM=MSYS
          export PATH="/usr/bin:$PATH"
          command -v gcc
          pacman -Q msys2-runtime
          sha256sum /usr/bin/msys-2.0.dll
          gcc -std=gnu11 -O2 -Wall -Wextra -Werror -pthread \
            experiments/issue-809/msys2_fifo_unmodified_baseline.c \
            -o "$RUNNER_TEMP/git809_fifo_baseline.exe"
          printf 'Supplementary already-open FIFO data-read benchmark\n' > "$RUNNER_TEMP/fifo_read_baseline.txt"
          for writers in 1 3 16 32; do
            for repetition in 1 2; do
              printf 'REPETITION=%s ' "$repetition" | tee -a "$RUNNER_TEMP/fifo_read_baseline.txt"
              "$RUNNER_TEMP/git809_fifo_baseline.exe" "$writers" 1001 600 | tee -a "$RUNNER_TEMP/fifo_read_baseline.txt"
            done
          done
      - name: Verify native connection control and reproduce two-instance stock behavior
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bash = 'D:\git-sdk-64-full\usr\bin\bash.exe'
          if (-not (Test-Path $bash)) { throw "Git-for-Windows SDK Bash missing: $bash" }
          foreach ($direction in @('read', 'write')) {
            Write-Host "CONTROL: two native instances, Git Bash $direction"
            & python -u experiments/issue-809/windows_pipe_open_trace.py --client bash --instances 2 --direction $direction --bash $bash --expect success 2>&1 |
              Tee-Object -Append -FilePath "$env:RUNNER_TEMP\native_connection_trace.txt"
            if ($LASTEXITCODE -ne 0) { throw "Two-instance control failed: $direction" }
            Write-Host "KNOWN BROKEN: one native instance, Git Bash $direction"
            & python -u experiments/issue-809/windows_pipe_open_trace.py --client bash --instances 1 --direction $direction --bash $bash --expect failure 2>&1 |
              Tee-Object -Append -FilePath "$env:RUNNER_TEMP\native_connection_trace.txt"
            if ($LASTEXITCODE -ne 0) { throw "Negative control failed: $direction" }
          }
      - name: Benchmark opening and closing native pipes in one persistent Git Bash
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bash = 'D:\git-sdk-64-full\usr\bin\bash.exe'
          & python -u experiments/issue-809/windows_pipe_open_latency.py --bash $bash --iterations 50 --out "$env:RUNNER_TEMP\native_connection_latency.json" 2>&1 |
            Tee-Object -FilePath "$env:RUNNER_TEMP\native_connection_latency.log"
          if ($LASTEXITCODE -ne 0) { throw 'Persistent Bash open/transfer/close measurement failed' }
      - name: Require one-instance native connection for both directions (intentional functional RED)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $bash = 'D:\git-sdk-64-full\usr\bin\bash.exe'
          $failures = 0
          foreach ($direction in @('read', 'write')) {
            & python -u experiments/issue-809/windows_pipe_open_trace.py --client bash --instances 1 --direction $direction --bash $bash --expect success 2>&1 |
              Tee-Object -Append -FilePath "$env:RUNNER_TEMP\native_connection_trace.txt"
            if ($LASTEXITCODE -ne 0) {
              Write-Host "EXPECTED_RED: extra metadata connection prevents single-instance Bash $direction"
              $failures += 1
            }
          }
          if ($failures -gt 0) {
            throw "RED: $failures of 2 single-instance native-connection assertions failed"
          }
          Write-Host "GREEN: read and write both function with one native server instance"
      - name: Preserve RED and performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-809-pipe-open-red-baseline
          path: |
            ${{ runner.temp }}/fifo_read_baseline.txt
            ${{ runner.temp }}/native_connection_trace.txt
            ${{ runner.temp }}/native_connection_latency.json
            ${{ runner.temp }}/native_connection_latency.log
          if-no-files-found: warn
